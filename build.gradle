import java.text.SimpleDateFormat

buildscript {
    ext {
        arcVersion = 'v1' // 自己维护的 Arc fork (github.com/caliniya/Arc)
    }
    
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        google()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        //classpath 'com.android.tools.build:gradle:8.1.2'
    }
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "Vergvoke"
        versionCode = 1
        version = '1.0'
    }

    repositories {
        mavenLocal()      
        maven { url "https://jitpack.io" }
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
    tasks.withType(JavaCompile){
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
        options.encoding = "UTF-8"
    }
}


//其余模块同样统一使用 Java 17
// 注意：不能在这里 apply "java"，:android / :android-old 与 java 插件互斥
configure(subprojects) {
    tasks.withType(JavaCompile) {
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
        options.compilerArgs.addAll(['--release', '17'])
        options.fork = true
    }

    tasks.withType(Javadoc){
        options{
            addStringOption('Xdoclint:none', '-quiet')
            addStringOption('-release', '17')
            encoding('UTF-8')
        }
    }
}


project(":desktop") {
    apply plugin: "java"

    compileJava.options.fork = true

    dependencies {
        implementation project(":core")

        implementation "com.github.caliniya.Arc:natives-desktop:$arcVersion"
        implementation "com.github.caliniya.Arc:backend-sdl3:$arcVersion"
    }
}

project(":annotation") {
    apply plugin: "java"
    sourceSets.main.java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main"
    dependencies {
        //compileOnly gradleApi()
        // AutoProcessor 已并入 arc-core:经下面这行激活,@AnnoProc 标记的处理器自动生成 SPI
        annotationProcessor "com.github.caliniya.Arc:arc-core:$arcVersion"
        implementation 'com.squareup:javapoet:1.12.1'
        implementation "com.github.caliniya.Arc:arc-core:$arcVersion"
    }
}

project(":core") {
    apply plugin: "java-library"
    //compileJava.options.fork = true
    dependencies {

        implementation project(":annotation")
        annotationProcessor project(":annotation")

        // 这是啥来着
        api "org.lz4:lz4-java:1.8.0"
        
        // Arc（经 settings.gradle 的 includeBuild 替换为本地 arc/ 源码）
        api "com.github.caliniya.Arc:arc-core:$arcVersion"
    }
}

project(":tools") {
    apply plugin: "java-library"
    sourceSets.main.java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main"
    compileJava.options.fork = true

    dependencies {
        // api：IconGen/TexturePackerTool 是纯构建工具,引入 arc 类型即可编译
        api "com.github.caliniya.Arc:arc-core:$arcVersion"
    }
}
