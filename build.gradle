import java.text.SimpleDateFormat

buildscript {
    ext {
        arcVersion = 'v157.1'  // https://github.com/Anuken/Arc
    }
    
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        google()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        //classpath 'com.android.tools.build:gradle:8.1.2'
        // 构建脚本需要的 Arc 模块
        classpath "com.github.Anuken.Arc:arc-core:$arcVersion"
    }
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "Vergvoke"
        versionCode = 1
        version = '1.0'
    }

    repositories {
        mavenLocal()      
        maven { url "https://jitpack.io" }
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
    tasks.withType(JavaCompile){
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
        options.encoding = "UTF-8"
    }
}


//其余模块同样统一使用 Java 17
// 注意：不能在这里 apply "java"，:android / :android-old 与 java 插件互斥
configure(subprojects) {
    tasks.withType(JavaCompile) {
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
        options.compilerArgs.addAll(['--release', '17'])
        options.fork = true
    }

    tasks.withType(Javadoc){
        options{
            addStringOption('Xdoclint:none', '-quiet')
            addStringOption('-release', '17')
            encoding('UTF-8')
        }
    }
}


project(":desktop") {
    apply plugin: "java"

    compileJava.options.fork = true

    dependencies {
        implementation project(":core")
        
        implementation "com.github.Anuken.Arc:natives-desktop:$arcVersion"
        implementation "com.github.Anuken.Arc:natives-freetype-desktop:$arcVersion"
        implementation "com.github.Anuken.Arc:backend-sdl:$arcVersion"
    }
}

project(":annotation") {
    apply plugin: "java"
    sourceSets.main.java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main"
    dependencies {
        //compileOnly gradleApi()
        implementation project(":tools")
        annotationProcessor project(":tools")
        implementation 'com.squareup:javapoet:1.12.1'
        implementation "com.github.Anuken.Arc:arc-core:$arcVersion"
    }
}

project(":core") {
    apply plugin: "java-library"
    //compileJava.options.fork = true
    dependencies {

        implementation project(":annotation")
        annotationProcessor project(":annotation")
        implementation project(":tools")
        
        // 这是啥来着
        api "org.lz4:lz4-java:1.8.0"
        
        // Arc
        api "com.github.Anuken.Arc:arc-core:$arcVersion"
        api "com.github.Anuken.Arc:flabel:$arcVersion"
        api "com.github.Anuken.Arc:freetype:$arcVersion"
        api "com.github.Anuken.Arc:g3d:$arcVersion"
        api "com.github.Anuken.Arc:fx:$arcVersion"
        api "com.github.Anuken.Arc:arcnet:$arcVersion"
        api "com.github.Anuken.Arc:filedialogs:$arcVersion"
    }
}

project(":tools") {
    apply plugin: "java-library"
    sourceSets.main.java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main"
    compileJava.options.fork = true

    dependencies {
        implementation "com.github.Anuken.Arc:packer:$arcVersion"
        // api：annotation/core 通过 tools 拿到 Ar 等工具类时也需要 arc 类型
        api "com.github.Anuken.Arc:arc-core:$arcVersion"
    }
}
