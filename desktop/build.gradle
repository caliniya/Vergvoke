sourceCompatibility = 17
sourceSets.main.java.srcDirs = [ "src/" ]
// 让 IDE（VS Code / AIDE）也能看到注解处理器生成的代码（Gradle 编译时生成到 build/generated）
sourceSets.main.java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main"
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "caliniya.vergvoke.DesktopLauncher"
project.ext.assetsDir = new File("../assets")

import org.gradle.internal.os.OperatingSystem

tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    // 强制 JVM 以 UTF-8 输出，避免 Windows 控制台中文乱码
    jvmArgs += ["-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8", "-Dconsole.encoding=UTF-8"]

    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        // Required to run on macOS
        jvmArgs += "-XstartOnFirstThread"
    }
}

tasks.register('debug', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
    // 强制 JVM 以 UTF-8 输出，避免 Windows 控制台中文乱码
    jvmArgs += ["-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8", "-Dconsole.encoding=UTF-8"]
}

tasks.register('dist', Jar) {
    destinationDirectory = file("$buildDir/output")
    archiveFileName = "${appName}-${version}.jar"
    
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}


tasks.named('assemble') {
    dependsOn('dist')
}

dist.dependsOn classes


eclipse.project.name = appName + "-desktop"
